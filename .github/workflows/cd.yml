name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name used when publishing artifacts"
        required: false
        default: "Manual build"

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build Android release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        run: ./gradlew --no-daemon :composeApp:testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon :composeApp:lintVitalRelease

      - name: Build release APK and AAB
        run: ./gradlew --no-daemon :composeApp:assembleRelease :composeApp:bundleRelease

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          generate_release_notes: true

  ios-framework:
    name: Build iOS framework artifact
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build iOS simulator framework
        run: ./gradlew --no-daemon :composeApp:linkReleaseFrameworkIosSimulatorArm64

      - name: Package iOS framework
        run: |
          cd composeApp/build/bin/iosSimulatorArm64/releaseFramework
          zip -r ComposeApp-iosSimulatorArm64-releaseFramework.zip ComposeApp.framework

      - name: Upload iOS framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-release-framework
          path: composeApp/build/bin/iosSimulatorArm64/releaseFramework/ComposeApp-iosSimulatorArm64-releaseFramework.zip
          if-no-files-found: error

      - name: Publish iOS framework to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/bin/iosSimulatorArm64/releaseFramework/ComposeApp-iosSimulatorArm64-releaseFramework.zip
          generate_release_notes: true
